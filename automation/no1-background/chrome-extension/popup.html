<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>No1 연결</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>No1 백그라운드 연결</h1>
<p>로그인된 No1 웹 탭을 그대로 두세요. 창을 열거나 화면을 조작하지 않습니다.</p>
<label for="key">로컬 연결 코드</label><input id="key" type="password" autocomplete="off" maxlength="64" placeholder="복사한 연결 코드를 붙여넣으세요">
<div><button id="connect">연결</button><button id="disconnect">연결 해제</button></div>
<p id="status" role="status">연결 상태 확인 중</p>
<small>로그인 상태와 상품 1개의 재고·혜택·시세를 확인합니다. 자동 구매나 수익상품 승인은 하지 않습니다.</small>
<script type="module" src="popup.mjs"></script></body></html>
