<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070914">
  <meta name="color-scheme" content="dark">
  <title>박한수 에이전트 대쉬보드</title>
  <link rel="icon" type="image/x-icon" href="/agent-board.ico">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/three.min.js" defer></script>
  <script src="/orb.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body data-briefing="off">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><i></i></span>
      <div><span class="wordmark">AETHER</span><h1>박한수 에이전트 대쉬보드</h1></div>
    </div>
    <div class="top-actions">
      <span id="connection" class="connection" role="status">연결 확인 중</span>
      <div class="clock"><time id="clock"></time><span id="today"></span></div>
      <a class="chat-jump" href="#chat">채팅</a>
    </div>
  </header>
  <main class="workspace">
    <section class="board" aria-labelledby="board-title">
      <section class="hero" aria-label="현재 작업">
        <div class="ambient" aria-hidden="true"></div>
        <div id="orb" role="img" aria-label="작업 상태 · 연결 대기"></div>
        <div class="hero-head"><div><div class="board-label"><i></i> SHARED WORKSPACE</div><h2 id="board-title" lang="en">Agent Mission Control</h2></div></div>
      </section>
      <section class="agents-section" aria-label="에이전트 상태">
        <div class="roles">
          <article class="role" data-role="worker"><i class="role-dot"></i><div><div class="role-top"><h3>제임스 <small>실무자</small></h3><span class="role-status">대기</span></div><p class="role-task">상태 확인 중</p></div></article>
          <article class="role" data-role="reviewer"><i class="role-dot"></i><div><div class="role-top"><h3 title="Claire · 작업 검토와 일반 감사">클레어 <small>검토자 · 일반 감사</small></h3><span class="role-status">대기</span></div><p class="role-task">상태 확인 중</p></div></article>
          <article class="role" data-role="auditor"><i class="role-dot"></i><div><div class="role-top"><h3 title="Morgan · 제임스의 작업 감시와 핵심 사안 감사">모건 <small>감사총무</small></h3><span class="role-status">대기</span></div><p class="role-task">상태 확인 중</p></div></article>
        </div>
      </section>
      <section class="tasks-section" aria-labelledby="tasks-title">
        <div class="tasks-toolbar">
          <div class="head-group"><h2 id="tasks-title">작업 목록</h2><span id="task-count" class="count" aria-label="현재 표시 개수"></span></div>
          <div id="task-filters" class="filters" aria-label="작업 상태 필터">
            <button type="button" data-filter="all" aria-pressed="true">전체</button>
            <button type="button" data-filter="active" aria-pressed="false">진행</button>
            <button type="button" data-filter="blocked" aria-pressed="false">확인 필요</button>
            <button type="button" data-filter="done" aria-pressed="false">완료</button>
          </div>
        </div>
        <div id="tasks" class="task-list"></div>
      </section>
      <dl class="metrics" aria-label="전체 작업 집계">
        <div><dt>전체 요청</dt><dd id="metric-total">–</dd></div>
        <div><dt>진행 중</dt><dd id="metric-running">–</dd></div>
        <div><dt>확인 필요</dt><dd id="metric-blocked">–</dd></div>
        <div><dt>완료</dt><dd id="metric-done">–</dd></div>
      </dl>
      <template data-briefing-template>
        <section class="briefing" aria-labelledby="briefing-title">
          <div class="briefing-heading">
            <h2 id="briefing-title">브리핑</h2>
            <button type="button" id="open-hearts" class="open-hearts" aria-haspopup="dialog">내 취향 보관함 <span id="heart-count"></span></button>
          </div>
          <p id="heart-feedback" class="heart-feedback" role="status"></p>
          <div class="briefing-grid">
            <section class="brief-column brief-reading" aria-labelledby="brief-quotes-title">
              <header class="brief-column-head">
                <h3 id="brief-quotes-title">글귀와 시</h3>
                <span id="brief-quotes-count" class="brief-total"></span>
                <span id="brief-quotes-state" class="brief-state" role="status">불러오는 중…</span>
              </header>
              <ul id="brief-quotes" class="brief-list" tabindex="0" aria-labelledby="brief-quotes-title"></ul>
            </section>
            <section class="brief-column brief-news" aria-labelledby="brief-topics-title">
              <header class="brief-column-head">
                <h3 id="brief-topics-title">최근 AI 뉴스</h3>
                <span id="brief-topics-count" class="brief-total"></span>
                <span id="brief-news-state" class="brief-state" role="status">불러오는 중…</span>
              </header>
              <ul id="brief-topics" class="brief-list" tabindex="0" aria-labelledby="brief-topics-title"></ul>
            </section>
          </div>
        </section>
      </template>
    </section>
    <aside id="chat" class="chat" aria-labelledby="chat-title">
      <div class="chat-header">
        <div class="chat-nameplate"><span class="chat-symbol" aria-hidden="true"><i></i><i></i><i></i></span><h2 id="chat-title">요청 · 진행 채팅</h2></div>
        <button id="new-task" class="primary" type="button" title="새 작업 요청">＋ 새 요청</button>
      </div>
      <div class="chat-filter"><div class="select-wrap"><select id="chat-scope" aria-label="대화할 작업 선택"><option value="all">전체 대화</option></select></div>
        <button id="my-latest" type="button" hidden><strong>내 최근 메시지</strong><span></span><i aria-hidden="true">↗</i></button>
      </div>
      <div class="feed-wrap">
        <div id="chat-feed" role="log" aria-label="요청 및 진행 상황" aria-live="off" tabindex="0"></div>
        <button id="new-messages" class="new-messages" type="button" hidden>새 메시지 보기</button>
      </div>
      <form id="composer" class="composer">
        <div class="composer-box">
          <div class="compose-head"><div class="select-wrap"><select id="chat-mode" aria-label="메시지 목적"><option value="new">새 요청</option><option value="note">추가 지시</option></select></div></div>
          <label class="sr-only" for="message">작업 요청 또는 추가 지시</label>
          <textarea id="message" rows="2" placeholder="어떤 작업을 맡길까요?"></textarea>
          <div class="composer-foot"><span>Shift + Enter 줄바꿈</span><button type="submit" id="send" class="send-btn">보내기 <span aria-hidden="true">↗</span></button></div>
        </div>
        <div id="feedback" role="status" aria-live="polite"></div>
      </form>
    </aside>
  </main>
  <template data-briefing-template>
    <dialog id="passage-reader" class="heart-library" aria-labelledby="passage-title">
      <div class="library-heading"><h2 id="passage-title">글귀와 시</h2><button type="button" id="close-passage" class="close-hearts" autofocus>닫기</button></div>
      <p id="passage-text" class="passage-text"></p>
    </dialog>
    <dialog id="heart-library" class="heart-library" aria-labelledby="heart-library-title">
      <div class="library-heading"><h2 id="heart-library-title">내 취향 보관함</h2><button type="button" id="close-hearts" class="close-hearts" aria-label="보관함 닫기" autofocus>닫기</button></div>
      <p class="library-hint">하트는 이 PC의 내 프로필에 저장되고 다음 브리핑 추천에 반영됩니다.</p>
      <section id="library-interests" class="library-interests" aria-labelledby="interests-title" hidden>
        <h3 id="interests-title">자주 하트한 주제</h3>
        <ul id="interest-list"></ul>
      </section>
      <p id="library-feedback" class="heart-feedback" role="status"></p>
      <ol id="saved-hearts"></ol>
    </dialog>
  </template>
</body>
</html>
